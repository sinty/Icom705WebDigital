# Сборка WASM-декодера и публикация страницы на GitHub Pages.
#
# Готовые артефакты в репозитории не хранятся: их собирает этот workflow из
# исходников, поэтому сборка воспроизводима, а история не тащит бинарники.
# Версии зависимостей пришпилены коммитами — те же, на которых всё проверено
# (см. NOTES.md, раздел про сборку в WebAssembly).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write нужен, чтобы публиковать собранный сайт в ветку gh-pages.
# Механизм Pages-через-Actions не используется намеренно: он требует загрузки
# actions/upload-pages-artifact и actions/deploy-pages с codeload.github.com,
# а тот отдавал 429 и 503 — сборка падала не доходя до своих шагов.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MBELIB_COMMIT: 30dc79074ca022366a27d705b8023011d9600339
  DSDFME_COMMIT: c960f9932ce6827f15656bc3b318b234b3dd2f34
  LIBSNDFILE_TAG: 1.2.2
  # та версия, на которой сборка проверена локально
  EMSDK_VERSION: 6.0.6
  EMSDK_DIR: /home/runner/emsdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node намеренно не используется: Node на раннере уже есть, а каждое
      # лишнее действие — ещё одна загрузка с codeload.github.com, которая может
      # получить 429 ещё до запуска наших шагов (так и случилось однажды).
      - name: Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      # emsdk ставится напрямую, без сторонних действий: первая же сборка упала
      # именно на них. Здесь ровно те команды, которыми собрано локально, и
      # версия пришпилена — ломаться нечему, кроме самого emsdk.
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          # 429 при загрузке случается и просто от занятости — пробуем трижды
          ok=
          for i in 1 2 3; do
            if "$EMSDK_DIR/emsdk" install "$EMSDK_VERSION"; then ok=1; break; fi
            echo "попытка $i не удалась, ждём $((i * 20)) с"
            sleep $((i * 20))
          done
          [ -n "$ok" ] || { echo "emsdk не установился"; exit 1; }
          "$EMSDK_DIR/emsdk" activate "$EMSDK_VERSION"
          source "$EMSDK_DIR/emsdk_env.sh"
          emcc --version | head -1

      - name: Забрать исходники декодера
        run: |
          set -eux
          mkdir -p native/third_party
          cd native/third_party

          git clone --no-checkout https://github.com/lwvmobile/mbelib mbelib
          git -C mbelib fetch --depth 1 origin "$MBELIB_COMMIT"
          git -C mbelib checkout "$MBELIB_COMMIT"

          git clone --no-checkout https://github.com/lwvmobile/dsd-fme dsd-fme
          git -C dsd-fme fetch --depth 1 origin "$DSDFME_COMMIT"
          git -C dsd-fme checkout "$DSDFME_COMMIT"

          git clone --depth 1 -b "$LIBSNDFILE_TAG" \
            https://github.com/libsndfile/libsndfile libsndfile

      # emsdk_env.sh приходится подключать в каждом шаге: каждый run — новый шелл
      - name: mbelib
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          emcmake cmake -G Ninja -S native/third_party/mbelib \
            -B native/third_party/mbelib/build-wasm \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          ninja -C native/third_party/mbelib/build-wasm

      # CMAKE_POLICY_VERSION_MINIMUM нужен, если в системе CMake 4:
      # совместимость с cmake_minimum_required(VERSION < 3.5) там убрана.
      - name: libsndfile
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          emcmake cmake -G Ninja -S native/third_party/libsndfile \
            -B native/third_party/libsndfile/build-wasm \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF -DENABLE_EXTERNAL_LIBS=OFF -DENABLE_MPEG=OFF \
            -DENABLE_CPACK=OFF
          ninja -C native/third_party/libsndfile/build-wasm

      - name: Декодер в WASM
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          emcmake cmake -G Ninja -S native -B native/build
          ninja -C native/build dsd-fme-rb
          ls -la native/build/dsd-fme-rb.mjs native/build/dsd-fme-rb.wasm

      # Проверки, которым не нужны эталонные записи с радио
      - name: Тесты
        run: node test/scope_frames.mjs

      - name: Сборка сайта
        run: |
          set -eux
          mkdir -p _site/native/build _site/ref _site/tools
          cp index.html _site/
          cp -r web _site/
          cp tools/scope-preview.html _site/tools/
          cp native/build/dsd-fme-rb.mjs native/build/dsd-fme-rb.wasm _site/native/build/
          # нужна самопроверке декодера прямо в браузере, без радио
          cp ref/demod_stereo.wav _site/ref/
          # Jekyll иначе выбросит каталоги, начинающиеся с подчёркивания
          touch _site/.nojekyll
          du -sh _site

      # Публикуем обычным git, без действий Pages. Ветка каждый раз создаётся
      # заново и пушится с --force: это вывод сборки, история ему не нужна и
      # только раздувала бы репозиторий.
      - name: Публикация в ветку gh-pages
        working-directory: _site
        run: |
          git init -q
          git checkout -qb gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "сборка сайта из ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "опубликовано: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"
